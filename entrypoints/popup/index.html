<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slava Russian Dictionary</title>
    <style>
      :root {
        color-scheme: light dark;
        font:
          14px/1.4 system-ui,
          sans-serif;
      }
      body {
        width: 20rem;
        margin: 0;
      }
      main {
        padding: 1rem;
      }
      button {
        width: 100%;
        min-height: 2.5rem;
        margin: 0.35rem 0;
        font: inherit;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #ffbf47;
        outline-offset: 2px;
      }
      .secondary {
        background: transparent;
        color: inherit;
        border: 1px solid currentColor;
      }
      #status {
        min-height: 2.5rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="app-name">Slava Russian Dictionary</h1>
      <p id="popup-intro">
        Stress and morphology are offline. Definitions use Wiktionary only after
        you request one.
      </p>
      <button id="activate" type="button">
        Enable temporarily on this site
      </button>
      <button id="always" type="button">Always enable on this site</button>
      <p id="temporary-scope">
        Temporary access follows links on the same origin. Chrome revokes it
        when this tab navigates to another site; enable Slava there or grant
        that site persistent access.
      </p>
      <button id="deactivate" class="secondary" type="button">
        Disable on this tab
      </button>
      <button id="settings" class="secondary" type="button">
        Settings and diagnostics
      </button>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
