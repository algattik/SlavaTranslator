name: Release candidate

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run release-blocking quality gates
        run: |
          npm run release:gates
          npm run release:reproduce
          npm run release:sbom
          node tools/verify-release.mjs
          npm run test:e2e:packaged
          npm run release:evidence
      - name: Attest release ZIP provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: .output/slava-russian-dictionary-*-chrome.zip
      - name: Upload release candidate and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slava-russian-dictionary-${{ github.sha }}
          if-no-files-found: error
          path: |
            .output/slava-russian-dictionary-*-chrome.zip
            artifacts/
