name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.18.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run unit, property, and data tests
        run: npm test
      - name: Run deterministic Chromium tests
        run: npm run test:e2e
      - name: Verify release package, licenses, and compiled output
        run: npm run release:verify
      - name: Run exact packaged-ZIP smoke
        run: npm run test:e2e:packaged
      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-evidence
          if-no-files-found: ignore
          path: |
            artifacts/
            test-results/

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Review dependency changes
        uses: actions/dependency-review-action@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v4
        with:
          fail-on-severity: high
